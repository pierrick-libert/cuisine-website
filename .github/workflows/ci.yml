name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            public-site/package-lock.json

      # public-site/ must be installed before the backend tests: render-recipe.ts/rebuild-
      # index.ts import ../../../public-site/src/* directly (a real, not mocked, @11ty/eleventy
      # call) and resolve that package from public-site's own node_modules at test-run time.
      - name: Install public-site dependencies
        run: npm ci
        working-directory: public-site
      - name: public-site typecheck
        run: npm run typecheck
        working-directory: public-site
      - name: public-site lint
        run: npm run lint
        working-directory: public-site
      - name: public-site tests
        run: npm test
        working-directory: public-site

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Backend typecheck
        run: npm run typecheck
        working-directory: backend
      - name: Backend lint
        run: npm run lint
        working-directory: backend
      - name: Start DynamoDB Local
        run: npm run db:local:up
        working-directory: backend
      - name: Wait for DynamoDB Local
        run: until curl -s http://localhost:8000 >/dev/null; do sleep 1; done
      - name: Create local table
        run: npm run create-table:local
        working-directory: backend
      - name: Backend tests
        run: npm test
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      # public-site/node_modules must exist locally for esbuild to bundle
      # backend/src/pipeline/render-recipe.ts/rebuild-index.ts, which import
      # ../../../public-site/src/render.js (a real @11ty/eleventy call).
      - name: Install public-site dependencies
        run: npm ci
        working-directory: public-site
      # infra/pipeline.ts copies THIS node_modules (not public-site's) into the Eleventy-using
      # Lambda bundles via copyFiles — it's gitignored like any node_modules, so it must be
      # installed fresh here every deploy, same as the three above.
      - name: Install Eleventy Lambda dependencies
        run: npm ci
        working-directory: infra/.eleventy-lambda-deps

      - name: Deploy
        run: npx sst deploy --stage production
