<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;0,700&family=Karla:wght@400;500;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Karla', -apple-system, BlinkMacSystemFont, sans-serif; background: oklch(98% 0.016 145); color: oklch(22% 0.006 145); }
    a { color: oklch(46% 0.1 145); text-decoration: none; }
    a:hover { color: oklch(37% 0.1 145); }
    h1, h2 { font-family: 'Spectral', Georgia, 'Times New Roman', serif; margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }
  </style>
</helmet>

<div style="max-width: 1040px; margin: 0 auto; padding: 28px 32px 60px;">

  <!-- Top bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding-bottom: 22px; border-bottom: 1px solid oklch(89% 0.014 145);">
    <div style="font-family:'Spectral',serif; font-weight:600; font-size:19px; letter-spacing:0.02em;">Pierrick's Sunday Kitchen</div>
    <div style="display:flex; gap:6px;">
      <div style="padding:6px 14px; border-radius:999px; background:{{accent}}; color:oklch(99% 0.006 145); font-size:13px; font-weight:700;">EN</div>
      <div style="padding:6px 14px; border-radius:999px; border:1px solid oklch(87% 0.014 145); color:oklch(48% 0.006 145); font-size:13px; font-weight:500;">FR</div>
    </div>
  </div>

  <!-- Header + search -->
  <div style="padding-top:30px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;">
    <div>
      <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:oklch(40% 0.1 145); margin-bottom:6px;">Category</div>
      <h1 style="font-size:34px;">Desserts</h1>
    </div>
    <div style="display:flex; align-items:center; gap:8px; background:oklch(99% 0.012 145); border:1px solid oklch(87% 0.014 145); border-radius:10px; padding:9px 14px; min-width:260px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(55% 0.006 145)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input placeholder="Search desserts&hellip;" style="border:none; outline:none; background:transparent; font-size:14px; color:oklch(22% 0.006 145); width:100%;"/>
    </div>
  </div>

  <!-- Category pills -->
  <div style="display:flex; gap:8px; margin-top:22px; flex-wrap:wrap;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
      <div style="padding:7px 16px; border-radius:999px; font-size:13px; font-weight:600; background:{{c.bg}}; color:{{c.color}}; border:1px solid {{c.border}};">{{c.label}}</div>
    </sc-for>
  </div>

  <!-- Grid -->
  <div style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:24px; margin-top:30px;">
    <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
      <div style="background:oklch(99% 0.012 145); border:1px solid oklch(90% 0.014 145); border-radius:14px; overflow:hidden; display:flex; flex-direction:column;">
        <div style="height:150px; background:{{r.grad}};"></div>
        <div style="padding:16px; display:flex; flex-direction:column; gap:8px; flex:1;">
          <span style="align-self:flex-start; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:oklch(40% 0.1 145); background:oklch(89% 0.05 145); padding:3px 9px; border-radius:6px;">{{r.category}}</span>
          <h2 style="font-size:17px; line-height:1.35; font-weight:700;">{{r.name}}</h2>
          <span style="font-size:12.5px; color:oklch(48% 0.006 145); margin-top:auto;">{{r.time}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- Pagination -->
  <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:38px;">
    <button style="width:34px; height:34px; border-radius:8px; border:1px solid oklch(87% 0.014 145); background:oklch(99% 0.012 145); color:oklch(58% 0.006 145); font-size:14px;">&larr;</button>
    <button style="width:34px; height:34px; border-radius:8px; border:none; background:{{accent}}; color:oklch(99% 0.006 145); font-weight:700; font-size:14px;">1</button>
    <button style="width:34px; height:34px; border-radius:8px; border:1px solid oklch(87% 0.014 145); background:oklch(99% 0.012 145); color:oklch(22% 0.006 145); font-size:14px;">2</button>
    <button style="width:34px; height:34px; border-radius:8px; border:1px solid oklch(87% 0.014 145); background:oklch(99% 0.012 145); color:oklch(22% 0.006 145); font-size:14px;">3</button>
    <span style="padding:0 4px; color:oklch(58% 0.006 145); font-size:14px;">&hellip;</span>
    <button style="width:34px; height:34px; border-radius:8px; border:1px solid oklch(87% 0.014 145); background:oklch(99% 0.012 145); color:oklch(22% 0.006 145); font-size:14px;">7</button>
    <button style="width:34px; height:34px; border-radius:8px; border:1px solid oklch(87% 0.014 145); background:oklch(99% 0.012 145); color:oklch(58% 0.006 145); font-size:14px;">&rarr;</button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#5C7A52", "options": ["#5C7A52", "#4F6B52", "#6E7F4F"]}
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? "#5C7A52";
    const catNames = ["All", "Starters", "Mains", "Desserts", "Drinks"];
    const cats = catNames.map((label) => {
      const active = label === "Desserts";
      return {
        label: label,
        bg: active ? accent : "oklch(99% 0.012 145)",
        color: active ? "#fdfdfb" : "oklch(40% 0.006 145)",
        border: active ? accent : "oklch(87% 0.014 145)"
      };
    });
    const grads = [
      "linear-gradient(135deg, oklch(88% 0.05 60), oklch(80% 0.07 40))",
      "linear-gradient(135deg, oklch(84% 0.06 100), oklch(78% 0.08 70))",
      "linear-gradient(135deg, oklch(82% 0.06 30), oklch(74% 0.09 15))",
      "linear-gradient(135deg, oklch(86% 0.05 130), oklch(78% 0.07 110))",
      "linear-gradient(135deg, oklch(85% 0.06 50), oklch(76% 0.08 25))",
      "linear-gradient(135deg, oklch(87% 0.05 80), oklch(79% 0.07 55))"
    ];
    const names = [
      ["Grandma's Apple Tart", "45 min bake"],
      ["Salted Caramel Pots de Crème", "20 min + chill"],
      ["Lemon Olive Oil Cake", "50 min bake"],
      ["Dark Chocolate Mousse", "15 min + chill"],
      ["Honey Fig Galette", "35 min bake"],
      ["Poached Pear in Red Wine", "40 min simmer"]
    ];
    const recipes = names.map((n, i) => ({
      name: n[0], time: n[1], category: "Dessert", grad: grads[i]
    }));
    return { accent: accent, cats: cats, recipes: recipes };
  }
}
</script>
</body>
</html>
